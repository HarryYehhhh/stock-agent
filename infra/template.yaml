AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Daily US tech-stock earnings reminder pushed to a single Telegram chat

Parameters:
  AppName:
    Type: String
    Default: earnings-agent
  FinnhubApiKey:
    Type: String
    NoEcho: true
  GeminiApiKey:
    Type: String
    NoEcho: true
  TelegramBotToken:
    Type: String
    NoEcho: true
  TelegramChatId:
    Type: String
    NoEcho: true

Resources:
  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-scheduler"
      PackageType: Image
      ImageConfig:
        Command: ["agent.scheduler_handler.handler"]
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          FINNHUB_API_KEY: !Ref FinnhubApiKey
          GEMINI_API_KEY: !Ref GeminiApiKey
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          POWERTOOLS_SERVICE_NAME: !Ref AppName
          LOG_LEVEL: INFO
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 0 * * ? *)"
            ScheduleExpressionTimezone: UTC
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../
      DockerTag: scheduler
