AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Telegram-based AI agent for US stock earnings calls

Parameters:
  AppName:
    Type: String
    Default: earnings-agent
  Region:
    Type: String
    Default: ap-northeast-1
  AlarmEmail:
    Type: String
    Description: Email address subscribed to pipeline failure alarms (set at deploy time; do not commit real value).

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures: [x86_64]
    Environment:
      Variables:
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        SUBSCRIBERS_TABLE: !Ref SubscribersTable
        PROCESSED_UPDATES_TABLE: !Ref ProcessedUpdatesTable
        WATCHLIST_TABLE: !Ref WatchlistTable
        EARNINGS_CALENDAR_TABLE: !Ref EarningsCalendarTable
        EARNINGS_NOTIFICATIONS_TABLE: !Ref EarningsNotificationsTable
        COMPANY_SUMMARIES_TABLE: !Ref CompanySummariesTable
        NEWS_TABLE: !Ref NewsTable
        RATE_LIMITS_TABLE: !Ref RateLimitsTable
        TRACES_TABLE: !Ref TracesTable
        CORRECTIONS_TABLE: !Ref CorrectionsTable
        UPDATES_QUEUE_URL: !Ref UpdatesQueue
        POWERTOOLS_SERVICE_NAME: !Ref AppName
        LOG_LEVEL: INFO

Resources:
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-conversations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-subscribers"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: S
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH

  ProcessedUpdatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-processed-updates"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: update_id
          AttributeType: N
      KeySchema:
        - AttributeName: update_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WatchlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-watchlist"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: S
        - AttributeName: symbol
          AttributeType: S
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH
        - AttributeName: symbol
          KeyType: RANGE

  EarningsCalendarTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-earnings-calendar"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: symbol
          AttributeType: S
        - AttributeName: earning_date
          AttributeType: S
      KeySchema:
        - AttributeName: symbol
          KeyType: HASH
        - AttributeName: earning_date
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: earning-date-index
          KeySchema:
            - AttributeName: earning_date
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  EarningsNotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-earnings-notifications"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: S
        - AttributeName: notify_key
          AttributeType: S
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH
        - AttributeName: notify_key
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  CompanySummariesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-company-summaries"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: symbol
          AttributeType: S
        - AttributeName: earning_date
          AttributeType: S
      KeySchema:
        - AttributeName: symbol
          KeyType: HASH
        - AttributeName: earning_date
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  NewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-news"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: headline
          AttributeType: S
        - AttributeName: bucket
          AttributeType: S
        - AttributeName: published_at
          AttributeType: S
      KeySchema:
        - AttributeName: headline
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: published-at-index
          KeySchema:
            - AttributeName: bucket
              KeyType: HASH
            - AttributeName: published_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-rate-limits"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: S
        - AttributeName: window_key
          AttributeType: S
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH
        - AttributeName: window_key
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  TracesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-traces"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chat_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: bucket
          AttributeType: S
        - AttributeName: ts
          AttributeType: S
      KeySchema:
        - AttributeName: chat_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: trace-time-index
          KeySchema:
            - AttributeName: bucket
              KeyType: HASH
            - AttributeName: ts
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  CorrectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-corrections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: correction_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: correction_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UpdatesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AppName}-updates"
      VisibilityTimeout: 360
      MessageRetentionPeriod: 3600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt UpdatesDLQ.Arn
        maxReceiveCount: 3

  UpdatesDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AppName}-updates-dlq"
      MessageRetentionPeriod: 1209600

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-webhook"
      PackageType: Image
      ImageConfig:
        Command: ["agent.webhook_handler.handler"]
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProcessedUpdatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt UpdatesQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub "arn:aws:ssm:${Region}:${AWS::AccountId}:parameter/earnings-agent/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:aws:kms:${Region}:${AWS::AccountId}:key/alias/aws/ssm"
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: POST
            Path: /webhook
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../
      DockerTag: webhook

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-processor"
      PackageType: Image
      ImageConfig:
        Command: ["agent.processor_handler.handler"]
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscribersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WatchlistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EarningsCalendarTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CorrectionsTable
        - SQSPollerPolicy:
            QueueName: !GetAtt UpdatesQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub "arn:aws:ssm:${Region}:${AWS::AccountId}:parameter/earnings-agent/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:aws:kms:${Region}:${AWS::AccountId}:key/alias/aws/ssm"
      Events:
        Sqs:
          Type: SQS
          Properties:
            Queue: !GetAtt UpdatesQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 10
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../
      DockerTag: processor

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-scheduler"
      PackageType: Image
      ImageConfig:
        Command: ["agent.scheduler_handler.handler"]
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SubscribersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WatchlistTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EarningsCalendarTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EarningsNotificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CompanySummariesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracesTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub "arn:aws:ssm:${Region}:${AWS::AccountId}:parameter/earnings-agent/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:aws:kms:${Region}:${AWS::AccountId}:key/alias/aws/ssm"
      Events:
        SyncSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 8 * * ? *)"
            ScheduleExpressionTimezone: Asia/Taipei
            State: ENABLED
            Input: '{"mode": "sync"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
        NotifySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 10 * * ? *)"
            ScheduleExpressionTimezone: Asia/Taipei
            State: ENABLED
            Input: '{"mode": "notify"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../
      DockerTag: scheduler

  PipelineAlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AppName}-pipeline-alarms"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PipelineAlarmsTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  SchedulerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-scheduler-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SchedulerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PipelineAlarmsTopic]

  ProcessorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-processor-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessorFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PipelineAlarmsTopic]

  SchedulerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-scheduler-duration"
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref SchedulerFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 250000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PipelineAlarmsTopic]

  DlqMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-dlq-messages"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt UpdatesDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PipelineAlarmsTopic]

Outputs:
  WebhookUrl:
    Description: Public webhook URL for Telegram setWebhook
    Value: !Sub "https://${WebhookApi}.execute-api.${Region}.amazonaws.com/prod/webhook"
  UpdatesQueueUrl:
    Value: !Ref UpdatesQueue
