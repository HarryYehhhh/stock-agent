name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: PYTHONPATH=src uv run pytest tests/ -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # 同一時間只允許一個 deploy job：後來的 run 排隊等前一個完成，
    # 不取消進行中的部署（中斷 sam deploy 會留下半套 changeset）。
    # 避免 CloudFormation "UPDATE_IN_PROGRESS state and can not be updated"
    # 的並發撞車（2026-07-25 CI 與本地 make deploy 同時跑曾因此失敗）。
    concurrency:
      group: deploy-earnings-agent
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: cd infra && sam build

      - name: SAM deploy
        run: |
          cd infra && sam deploy \
            --stack-name earnings-agent \
            --region ap-northeast-1 \
            --capabilities CAPABILITY_IAM \
            --resolve-image-repos \
            --resolve-s3 \
            --no-fail-on-empty-changeset

      - name: Post-deploy smoke test
        run: make smoke-test-processor STACK=earnings-agent REGION=ap-northeast-1
