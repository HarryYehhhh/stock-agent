[project]
name = "earnings-agent"
version = "0.1.0"
description = "Telegram-based AI agent for US stock earnings calls"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "aws-lambda-powertools>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "moto[dynamodb,sqs]>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
